[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "creative_code"
version = "1.0.0"
description = "Gradient-based saliency visualization nodes for ComfyUI. Includes a single-method visualizer, a six-method comparison grid, and an art-focused composition node with colormaps and blend modes."
authors = [
  {name = "Claire Vlases", email = "clairevlases@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = []
dependencies = [
    "saliency",
    "torchvision",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "bump-my-version",
    "coverage",
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

[project.urls]
Repository = "https://github.com/cvlases/creative_code"
BugTracker = "https://github.com/cvlases/creative_code/issues"
Documentation = "https://github.com/cvlases/creative_code/wiki"

[tool.comfy]
PublisherId = "clorb"
DisplayName = "Algorithmic Attention"
Icon = ""
Tags = []
Repository = "https://github.com/cvlases/creative_code"

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.mypy]
files = "."
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
line-length = 140
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = [
    "S102",
    "S307",
    "W293",
    "F",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
